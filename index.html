<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eco Tool Hub - Compost C:N Ratio Calculator</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #10b981;
            --accent-hover: #059669;
            --border-color: #334155;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        h1 {
            color: var(--accent-color);
            text-align: center;
            font-size: 24px;
            margin-bottom: 10px;
        }
        p.subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 12px;
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: var(--accent-color);
        }
        button {
            width: 100%;
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: var(--accent-hover);
        }
        .result {
            margin-top: 25px;
            padding: 15px;
            background-color: #0f172a;
            border-left: 4px solid var(--accent-color);
            border-radius: 6px;
            display: none;
        }
        .result h3 {
            margin: 0 0 8px 0;
            color: var(--accent-color);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Eco Tool Hub</h1>
        <p class="subtitle">Compost C:N Ratio Calculator</p>
        
        <div class="form-group">
            <label for="greenCarbon">Green Material (Nitrogen rich) Carbon (g):</label>
            <input type="number" id="greenCarbon" placeholder="e.g., 20">
        </div>

        <div class="form-group">
            <label for="greenNitrogen">Green Material Nitrogen (g):</label>
            <input type="number" id="greenNitrogen" placeholder="e.g., 1">
        </div>

        <div class="form-group">
            <label for="brownCarbon">Brown Material (Carbon rich) Carbon (g):</label>
            <input type="number" id="brownCarbon" placeholder="e.g., 60">
        </div>

        <div class="form-group">
            <label for="brownNitrogen">Brown Material Nitrogen (g):</label>
            <input type="number" id="brownNitrogen" placeholder="e.g., 1">
        </div>

        <button onclick="calculateCN()">Calculate Ratio</button>

        <div class="result" id="resultBox">
            <h3 id="ratioText"></h3>
            <p id="adviceText"></p>
        </div>
    </div>

    <script>
        function calculateCN() {
            const gc = parseFloat(document.getElementById('greenCarbon').value) || 0;
            const gn = parseFloat(document.getElementById('greenNitrogen').value) || 0;
            const bc = parseFloat(document.getElementById('brownCarbon').value) || 0;
            const bn = parseFloat(document.getElementById('brownNitrogen').value) || 0;

            const totalCarbon = gc + bc;
            const totalNitrogen = gn + bn;

            if (totalNitrogen === 0) {
                alert("Nitrogen total cannot be zero!");
                return;
            }

            const ratio = (totalCarbon / totalNitrogen).toFixed(1);
            const resultBox = document.getElementById('resultBox');
            const ratioText = document.getElementById('ratioText');
            const adviceText = document.getElementById('adviceText');

            resultBox.style.display = 'block';
            ratioText.innerHTML = `Your C:N Ratio is ${ratio}:1`;

            if (ratio >= 25 && ratio <= 30) {
                adviceText.innerHTML = "Perfect! This is the ideal C:N ratio for fast and efficient composting.";
            } else if (ratio < 25) {
                adviceText.innerHTML = "Too much Nitrogen (Green). Your pile might smell. Add more brown materials (dry leaves, cardboard).";
            } else {
                adviceText.innerHTML = "Too much Carbon (Brown). Decomposition will be very slow. Add more green materials (kitchen scraps, grass clippings).";
            }
        }
    </script>
</body>
</html>
